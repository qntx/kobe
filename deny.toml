# cargo-deny configuration for the Kobe workspace.
#
# Run with `cargo deny check` to enforce supply-chain hygiene:
# - advisories: every transitive dependency must be free of known CVEs
# - bans:       one version of every crate; the full `bitcoin` crate is denied
# - licenses:   only permissive licenses are allowed
# - sources:    only crates.io is trusted

[graph]
all-features        = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = [
  # chrono is unmaintained and has no patched release. It is in the
  # lockfile only through zxcvbn 3.1.1's unconditional
  # [target.'cfg(target_arch = "wasm32")'.dependencies] entry — not a
  # feature, so it cannot be disabled — and zxcvbn is used only by
  # kobe-cli (crates/kobe-cli/src/main.rs). chrono therefore compiles
  # only if the CLI is built for wasm32; the wasm32 CI job builds
  # `-p kobe` alone (--no-default-features --features all-chains) and
  # the CLI is never a wasm32 target, so chrono is never compiled.
  # Revisit: remove this entry when zxcvbn drops chrono; review by
  # 2027-02-27.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; lockfile-only via zxcvbn's wasm32-only dep, zxcvbn used only by kobe-cli which is never built for wasm32; remove when zxcvbn drops chrono; review by 2027-02-27" },
]

[licenses]
confidence-threshold = 0.8
allow                = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSD-1-Clause", "CC0-1.0", "Unlicense", "Zlib", "MPL-2.0", "Unicode-3.0"]

[licenses.private]
ignore = false

[bans]
multiple-versions          = "warn"
wildcards                  = "deny"
highlight                  = "all"
workspace-default-features = "allow"
external-default-features  = "allow"
allow-workspace            = true

deny = [{ crate = "bitcoin", reason = "kobe encodes BTC addresses/WIF locally and derives via its own BIP-32 wrapper; the full bitcoin crate must not be reintroduced" }]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
