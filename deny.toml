# cargo-deny configuration for the Kobe workspace.
#
# Run with `cargo deny check` to enforce supply-chain hygiene:
# - advisories: every transitive dependency must be free of known CVEs
# - bans:       one version of every crate; the full `bitcoin` crate is denied
# - licenses:   only permissive licenses are allowed
# - sources:    only crates.io is trusted

[graph]
all-features        = true
no-default-features = false

[output]
feature-depth = 1

[licenses]
confidence-threshold = 0.8
allow                = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSD-1-Clause", "CC0-1.0", "Unlicense", "Zlib", "MPL-2.0", "Unicode-3.0"]

[licenses.private]
ignore = false

[bans]
multiple-versions          = "warn"
wildcards                  = "deny"
highlight                  = "all"
workspace-default-features = "allow"
external-default-features  = "allow"
allow-workspace            = true

# Full `bitcoin` stack is banned: kobe-btc implements address/WIF locally
# and derives via kobe-core. `bitcoin_hashes` remains only as a
# transitive of `bip39` (acceptable, not the full protocol crate).
deny = [{ crate = "bitcoin", reason = "kobe-btc must not reintroduce the full bitcoin crate; use local encoding + Wallet::derive_secp256k1" }]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
