name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: qntx/workflows/.github/workflows/release-rust.yml@v2
    permissions:
      contents: write
    with:
      bin: kobe
      package: kobe-cli
      # Counter-proof for the glibc 2.28 rollout (no PR, do not merge): the
      # same gnu builds without glibc-floor (ubuntu-24.04 host glibc 2.39)
      # must fail the smoke in AlmaLinux 8 (glibc 2.28).
      targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      smoke-command: bitcoin --count 2 --json
      smoke-image: almalinux:8-minimal@sha256:771e3223b49005328247f22e21f41164dab2f5c3f80ba06f6f970cfd0fb3691a
