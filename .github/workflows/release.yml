name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: qntx/workflows/.github/workflows/release-rust.yml@v2
    permissions:
      contents: write
    with:
      bin: kobe
      package: kobe-cli
      # Pure Rust: the static musl builds run on every Linux distribution;
      # sh.qntx.org prefers them over the glibc builds.
      targets: >-
        x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
        x86_64-unknown-linux-musl aarch64-unknown-linux-musl
        aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc
