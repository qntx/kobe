name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: qntx/workflows/.github/workflows/release-rust.yml@v2
    permissions:
      contents: write
    with:
      bin: kobe
      package: kobe-cli
      # Pure Rust: the static musl builds run on every Linux distribution;
      # sh.qntx.org prefers them over the glibc builds.
      targets: >-
        x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
        x86_64-unknown-linux-musl aarch64-unknown-linux-musl
        aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      # The gnu builds link against glibc 2.28 (RHEL 8, Debian 10 and newer);
      # the build fails if a binary needs a newer GLIBC_x.y.
      glibc-floor: '2.28'
      # Derives from fresh OS entropy offline; secrets stay hidden without -r.
      smoke-command: bitcoin --count 2 --json
      # AlmaLinux 8 (glibc 2.28), multi-arch index digest for amd64 + arm64/v8.
      smoke-image: almalinux:8-minimal@sha256:771e3223b49005328247f22e21f41164dab2f5c3f80ba06f6f970cfd0fb3691a
