name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-bun.yml@v2
    permissions:
      contents: read
    with:
      scripts: "check:pkg test:coverage"
    # bun run lint → vp check + check-version
    # bun run test → vp run -r test (per-package vp test)
    # scripts → bun run check:pkg && bun run test:coverage
