name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-bun.yml@v2
    permissions:
      contents: read
    # bun run build → vp run -r build (no Rust)
    # bun run test → vp run -r test + repo-level scripts/*.test.ts

  rust:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      # rust-version omitted: rust-toolchain.toml pins the toolchain.
      deny: true
      doc: true
      package-check: true

  rust-minimal:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      features: --no-default-features

  portable:
    uses: qntx/workflows/.github/workflows/ci-rust-cross.yml@v2
    permissions:
      contents: read
    with:
      targets: thumbv7m-none-eabi wasm32-unknown-unknown aarch64-linux-android x86_64-linux-android aarch64-apple-ios aarch64-apple-ios-sim
      packages: kobe-core kobe-aptos kobe-arweave kobe-btc kobe-casper kobe-cosmos kobe-evm kobe-fil kobe-nostr kobe-spark kobe-sui kobe-svm kobe-ton kobe-tron kobe-xrpl kobe-vault kobe
      features: --no-default-features
      forbid-deps: getrandom
