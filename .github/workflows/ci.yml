name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  taplo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes @taplo/cli@0.7.0 fmt --check

  markdownlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes markdownlint-cli2@0.23.3 "*.md" "skills/**/*.md"

  rust:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      # rust-version omitted: rust-toolchain.toml pins the toolchain.
      deny: true
      doc: true
      package-check: true

  rust-minimal:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      packages: kobe
      features: --no-default-features

  portable:
    uses: qntx/workflows/.github/workflows/ci-rust-cross.yml@v2
    permissions:
      contents: read
    with:
      targets: thumbv7m-none-eabi wasm32-unknown-unknown aarch64-linux-android x86_64-linux-android aarch64-apple-ios aarch64-apple-ios-sim
      packages: kobe
      features: --no-default-features --features all-chains
      forbid-deps: getrandom
