[package]
name                   = "kobe-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
readme                 = "README.md"
description            = "Kobe core: Wallet, BIP-39 / BIP-32 / SLIP-10 derivation, derivation styles, shared types and errors"
keywords               = ["crypto", "wallet", "bip39", "mnemonic", "no_std"]
categories             = ["cryptography", "no-std"]

[features]
default = ["std"]
std     = ["bip39/std", "zeroize/std"]
# OS entropy for `Wallet::generate`; off by default so portable
# `--no-default-features` builds carry no `getrandom`.
os-rng     = ["dep:getrandom"]
camouflage = ["dep:hmac", "dep:sha2"]
slip10     = ["dep:ed25519-dalek", "dep:hmac", "dep:sha2"]
bip32      = ["dep:bip32-crate", "dep:k256", "dep:sha2"]
# Shared hash160 / Base58Check helpers for chain address encoding.
encoding = ["dep:sha2", "dep:ripemd", "dep:bs58"]
# Escape hatch: expose [`Wallet::seed`]. Prefer `derive_secp256k1` /
# `derive_ed25519`. Off by default so the raw 64-byte seed is not part of
# the public surface unless opted in.
raw-seed = []
# Expose well-known BIP-39 test vectors under `kobe_core::test_vectors`;
# intended for downstream test suites only. Pure `&'static str` constants.
test-vectors = []

[dependencies]
bip39.workspace     = true
rand_core.workspace = true
getrandom           = { workspace = true, optional = true }
hmac                = { workspace = true, optional = true }
sha2                = { workspace = true, optional = true }
ripemd              = { workspace = true, optional = true }
bs58                = { workspace = true, optional = true }
ed25519-dalek       = { workspace = true, optional = true }
bip32-crate         = { workspace = true, optional = true }
k256                = { workspace = true, optional = true }
hex.workspace       = true
thiserror.workspace = true
zeroize.workspace   = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
