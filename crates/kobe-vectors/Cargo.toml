[package]
name                   = "kobe-vectors"
publish                = false
description            = "Shared-vector runner: executes the JSON cases under vectors/ against the kobe-* public APIs."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[dev-dependencies]
kobe-core  = { workspace = true, features = ["bip32", "raw-seed"] }
kobe-nostr = { workspace = true }
kobe-vault = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
hex        = { workspace = true }
bs58       = { workspace = true }
rand_core  = { workspace = true }

[lints]
workspace = true
